name: Security audit

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock']
  push:
    branches: [main, develop, master]
    paths: ['Cargo.toml', 'Cargo.lock']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
