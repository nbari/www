name: Build

on:
  push:
    branches: ['**']
    tags: ['v[0-9]*', '[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu}
          - {os: ubuntu-latest, target: i686-unknown-linux-gnu}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
          - {os: ubuntu-latest, target: x86_64-unknown-linux-musl}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl}
          - {os: macos-15-intel, target: x86_64-apple-darwin}
          - {os: macos-latest, target: aarch64-apple-darwin}
          - {os: ubuntu-latest, target: x86_64-unknown-freebsd}
          - {os: ubuntu-latest, target: i686-unknown-freebsd}
          - {os: ubuntu-latest, target: aarch64-unknown-freebsd}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: extractions/setup-just@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Validate release tag and package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if tag != version:
              raise SystemExit(f"tag version {tag} differs from Cargo version {version}")
          PY
      - name: Install 32-bit Linux build tools
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Install FreeBSD cross compiler
        if: endsWith(matrix.target, '-freebsd')
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Install musl build tools
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools binutils
      - name: Build FreeBSD
        if: endsWith(matrix.target, '-freebsd')
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/build-freebsd.py "$TARGET"
      - name: Build Linux or macOS
        if: "!endsWith(matrix.target, '-freebsd')"
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup target add "$TARGET"
          cargo build --release --locked --bin www --target "$TARGET"
      - name: Build RPM and DEB packages
        if: endsWith(matrix.target, '-musl')
        env:
          TARGET: ${{ matrix.target }}
        run: |
          just package-tools
          just packages "$TARGET"
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          tar -czf "dist/www-$version-$TARGET.tar.gz" -C "target/$TARGET/release" www -C "$GITHUB_WORKSPACE" LICENSE README.md man/www.1
      - uses: actions/upload-artifact@v4
        with:
          name: www-${{ matrix.target }}
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- ./*.tar.gz ./*.deb ./*.rpm > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
