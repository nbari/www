name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release version
        id: version
        run: |
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          publish = os.environ["GITHUB_REF_TYPE"] == "tag"
          if publish:
              tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
              if tag != version:
                  raise SystemExit(f"tag version {tag} differs from Cargo version {version}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"publish={str(publish).lower()}", file=output)
          if not publish:
              print("Branch run: validate all artifacts without publishing.")
          PY

  build:
    needs: validate
    uses: ./.github/workflows/build.yml

  crate:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify the crates.io package without uploading
        run: cargo publish --dry-run --locked

  release:
    needs: [validate, build, crate]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: www-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- ./*.tar.gz ./*.deb ./*.rpm > SHA256SUMS
      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*

  publish:
    needs: [validate, release]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Verify the source package and check for an existing publication
        id: crate
        run: |
          cargo package --locked
          cargo run --locked --example fetch -- https://index.crates.io/3/w/www "$RUNNER_TEMP/www-index"
          python3 - <<'PY'
          import hashlib, json, os, tomllib
          from pathlib import Path
          package = tomllib.loads(Path("Cargo.toml").read_text())["package"]
          archive = Path(f"target/package/{package['name']}-{package['version']}.crate")
          checksum = hashlib.sha256(archive.read_bytes()).hexdigest()
          needed = True
          index = Path(os.environ["RUNNER_TEMP"], "www-index")
          for line in index.read_text().splitlines():
              entry = json.loads(line)
              if entry["vers"] == package["version"]:
                  if entry["cksum"] != checksum or entry["yanked"]:
                      raise SystemExit("Published version differs from this package or is yanked.")
                  print("Identical version is already published; skipping upload.")
                  needed = False
                  break
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"needed={str(needed).lower()}", file=output)
          PY
      - name: Get a crates.io token through Trusted Publishing
        if: steps.crate.outputs.needed == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish to crates.io
        if: steps.crate.outputs.needed == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
